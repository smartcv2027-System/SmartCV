name: SmartCV Backend CI/CD to Hugging Face Spaces

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hf-spaces.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Backend Regression Test Suite
        working-directory: ./backend
        run: |
          pytest -v

      - name: Deploy to Hugging Face Spaces
        if: success() && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE_NAME" ]; then
            echo "::warning ::Hugging Face secrets (HF_TOKEN, HF_USERNAME, HF_SPACE_NAME) are not configured in GitHub Secrets. Skipping automatic push."
            exit 0
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Automation"
          
          echo "Syncing backend/ folder to Hugging Face Space: $HF_USERNAME/$HF_SPACE_NAME..."
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME $(git subtree split --prefix backend main):main
          echo "Successfully pushed backend to Hugging Face Spaces!"
