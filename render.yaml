# SmartCV — Render.com Infrastructure Blueprint (100% Free Tier)
# ==============================================================================

services:
  - type: web
    name: smartcv-backend
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt # Or oregon, ohio, singapore
    buildCommand: "pip install --upgrade pip && pip install torch --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -c \"import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True); from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')\""
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Set in Render dashboard with your Supabase connection string
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://*.vercel.app,*"
      - key: SEED_ON_STARTUP
        value: "false"
      - key: WORKERS
        value: "1"
